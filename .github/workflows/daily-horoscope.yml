name: Generate Daily Horoscope

on:
  schedule:
    # 18:00 UTC = 23:30 IST -- runs a little before the next Indian day
    # starts, so latest.json is ready well before midnight IST.
    # GitHub's scheduler can lag by several minutes to ~an hour during
    # busy periods; this buffer accounts for that.
    - cron: "0 18 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the generated JSON

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's horoscope
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_daily_horoscope.py

      - name: Commit and push updated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily horoscope update"
          file_pattern: "docs/horoscope/**"

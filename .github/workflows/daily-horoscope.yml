name: Generate Daily Horoscope

on:
  schedule:
    - cron: "37 14 * * *"   # ~20:07 IST — first attempt, off the round hour
    - cron: "22 17 * * *"   # ~22:52 IST — backup attempt if the first failed
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if today's file already exists"
        type: boolean
        default: false

permissions:
  contents: write  # needed so the workflow can commit the generated JSON

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's horoscope
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_daily_horoscope.py

      - name: Commit and push updated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily horoscope update"
          file_pattern: "docs/horoscope/**"
